variables:
  AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"         # Stored in CI settings
  AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
  AWS_DEFAULT_REGION: "ap-southeast-2"
  AWS_ACCOUNT_ID: "${AWS_ACCOUNT_ID}"         # Set in CI/CD Settings
  TF_ROOT: "terraform"
  CLUSTER_NAME: "cluster-1"            # Your ECS Cluster & Service name
  SERVICE_NAME: "cluster-1"

stages:
  - validate
  - plan
  - apply
  - destroy
  - build
  - refresh
  - deploy
cache:
  paths:
    - .terraform

# ──────────────────────────────────────────────────────────────────────────────
validate:
  stage: validate
  image:
   name: registry.gitlab.com/gitlab-org/gitlab-build-images:terraform
   entrypoint:
    - '/usr/bin/env'
    - 'PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
  before_script:
    - cd terraform
    - terraform --version
    - terraform init
  script:
    - terraform validate
  rules:
    - when: always

plan:
  stage: plan
  image:
   name: registry.gitlab.com/gitlab-org/gitlab-build-images:terraform
   entrypoint:
    - '/usr/bin/env'
    - 'PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
  before_script:
    - cd $TF_ROOT
    - terraform init
  script:
    - terraform plan -out=tfplan -input=false
  artifacts:
    paths:
      - $TF_ROOT/tfplan
  rules:
    - when: always

apply:
  stage: apply
  image:
   name: registry.gitlab.com/gitlab-org/gitlab-build-images:terraform
   entrypoint:
    - '/usr/bin/env'
    - 'PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
  before_script:
    - cd $TF_ROOT
    - terraform init
  script:
    - terraform apply -input=false tfplan
  when: manual
  rules:
    - when: manual

destroy:
  stage: destroy
  image:
   name: registry.gitlab.com/gitlab-org/gitlab-build-images:terraform
   entrypoint:
    - '/usr/bin/env'
    - 'PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
  before_script:
    - cd $TF_ROOT
    - terraform init
  script:
    - terraform destroy -auto-approve
  when: manual      # Manual to confirm destruction
  rules:
    - when: manual
# ──────────────────────────────────────────────────────────────────────────────
build:
  stage: build
  image: docker:24.0.2
  services:
    - name: docker:24.0.2-dind
      alias: docker
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    # Install required tools
    - apk update && apk add --no-cache docker-cli
    - apk add --no-cache python3 aws-cli

    # Ensure Docker environment variables are properly set
    - export DOCKER_HOST="tcp://docker:2375"
    - docker --version
    - aws --version
    - aws ecr get-login-password --region ap-southeast-2 | docker login --username AWS --password-stdin 826730732655.dkr.ecr.ap-southeast-2.amazonaws.com
  script:
    - cd $CI_PROJECT_DIR
    - docker build -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/platform-starter:latest .
    - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/platform-starter:latest
  rules:
    - when: always

# ──────────────────────────────────────────────────────────────────────────────
refresh_taskdef:
  stage: refresh
  image:
    name: public.ecr.aws/aws-cli/aws-cli:latest
    entrypoint:
      - /bin/sh
      - -lc
  needs: ["build"]
  before_script:
    - aws --version
  script:
    # sanity check
    - aws --version && echo "CLUSTER=$CLUSTER_NAME SERVICE=$SERVICE_NAME"
    - aws ecs describe-task-definition --task-definition $CLUSTER_NAME --query 'taskDefinition' > base.json
    - yum install -y jq
    - jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' base.json > new-taskdef.json
    - NEW_ARN=$(aws ecs register-task-definition --cli-input-json file://new-taskdef.json --query 'taskDefinition.taskDefinitionArn' --output text)
    - echo "New task-def ARN:" $NEW_ARN
    - aws ecs update-service --cluster $CLUSTER_NAME --service $SERVICE_NAME --task-definition $NEW_ARN
  rules:
    - when: always

# ──────────────────────────────────────────────────────────────────────────────
deploy:
  stage: deploy
  image:
    name: public.ecr.aws/aws-cli/aws-cli:latest
    entrypoint:
      - /bin/sh
      - -lc
  needs: ["refresh_taskdef"]
  script:
    - echo "Forcing new deployment on $CLUSTER_NAME/$SERVICE_NAME"
    - aws ecs update-service --cluster $CLUSTER_NAME --service $SERVICE_NAME --force-new-deployment
  rules:
    - when: always