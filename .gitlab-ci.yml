variables:
  AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"         # Stored in CI settings
  AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
  AWS_DEFAULT_REGION: "ap-southeast-2"
  AWS_ACCOUNT_ID: "${AWS_ACCOUNT_ID}"
  TF_ROOT: "terraform"
  TF_STATE_CONFIG: "${TF_ROOT}/tfstate.config"

stages:
  - validate     # Check formatting and config
  - plan         # Generate Terraform plan
  - apply        # Apply Terraform changes
  - destroy      # Tear down resources
  - build        # Build & push Docker image

image:
   name: registry.gitlab.com/gitlab-org/gitlab-build-images:terraform
   entrypoint:
    - '/usr/bin/env'
    - 'PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'

cache:
  paths:
    - .terraform

before_script:
  - terraform --version
  - cd terraform
  - pwd
  - terraform init
  - cd ..

validate:
  stage: validate
  script:
    - cd $TF_ROOT
    - terraform validate

plan:
  stage: plan
  script:
    - cd $TF_ROOT
    - terraform plan -out=tfplan -input=false
  artifacts:
    paths:
      - $TF_ROOT/tfplan
  rules:
    - when: always

apply:
  stage: apply
  script:
    - cd $TF_ROOT
    - terraform apply -input=false tfplan
  when: manual      # Manual approval to avoid unintended changes
  rules:
    - when: manual

destroy:
  stage: destroy
  script:
    - cd $TF_ROOT
    - terraform destroy -auto-approve
  when: manual      # Manual to confirm destruction
  rules:
    - when: manual

build:
  stage: build
  image: docker:24.0.2
  services:
    - name: docker:24.0.2-dind
      alias: docker
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  before_script:
    # Install Docker CLI and AWS CLI
    - apk update && apk add --no-cache docker-cli
    - apk add --no-cache python3 aws-cli

    # Check Docker and AWS versions
    - docker --version
    - aws --version

    # Test Docker daemon connectivity
    - echo "Testing Docker daemon connectivity..."
    - docker info || (echo "Docker daemon not available"; exit 1)

    # Print the Docker path to verify location
    - which docker
    - ls -l /usr/local/bin/docker

    # Explicitly set Docker host
    - export DOCKER_HOST="tcp://docker:2375"

    # Attempt to log in to ECR using explicit Docker binary path
    - echo "Logging in to ECR..."
    - aws ecr get-login-password --region $AWS_DEFAULT_REGION | \
        /usr/local/bin/docker login --username AWS --password-stdin \
        $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

  script:
    # Build and push Docker image
    - docker build -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/platform-starter:latest .
    - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/platform-starter:latest

  rules:
    - when: always