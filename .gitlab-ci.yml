variables:
  AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"         # Stored in CI settings
  AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
  AWS_DEFAULT_REGION: "ap-southeast-2"
  AWS_ACCOUNT_ID: "${AWS_ACCOUNT_ID}"
  TF_ROOT: "terraform"
  TF_STATE_CONFIG: "${TF_ROOT}/tfstate.config"
  CLUSTER_NAME: "platform-cluster"
  SERVICE_NAME: "platform-cluster"

stages:
  - validate     # Check formatting and config
  - plan         # Generate Terraform plan
  - apply        # Apply Terraform changes
  - destroy      # Tear down resources
  - build        # Build & push Docker image
  - refresh
  - deploy

image:
   name: registry.gitlab.com/gitlab-org/gitlab-build-images:terraform
   entrypoint:
    - '/usr/bin/env'
    - 'PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'

cache:
  paths:
    - .terraform

before_script:
  - terraform --version
  - cd terraform
  - pwd
  - terraform init
  - cd ..

validate:
  stage: validate
  script:
    - cd $TF_ROOT
    - terraform validate

plan:
  stage: plan
  script:
    - cd $TF_ROOT
    - terraform plan -out=tfplan -input=false
  artifacts:
    paths:
      - $TF_ROOT/tfplan
  rules:
    - when: always

apply:
  stage: apply
  script:
    - cd $TF_ROOT
    - terraform apply -input=false tfplan
  when: manual      # Manual approval to avoid unintended changes
  rules:
    - when: manual

destroy:
  stage: destroy
  script:
    - cd $TF_ROOT
    - terraform destroy -auto-approve
  when: manual      # Manual to confirm destruction
  rules:
    - when: manual

# ──────────────────────────────────────────────────────────────────────────────
build:
  stage: build
  image: docker:24.0.2
  services:
    - name: docker:24.0.2-dind
      alias: docker
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker --version
    - apk add --no-cache curl unzip python3
    - curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
    - unzip -q awscliv2.zip && ./aws/install
    - aws --version
    - aws ecr get-login-password --region $AWS_DEFAULT_REGION | \
        docker login --username AWS --password-stdin \
        $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
  script:
    - cd $CI_PROJECT_DIR
    - docker build -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/platform-starter:latest .
    - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/platform-starter:latest
  rules:
    - when: always

# ──────────────────────────────────────────────────────────────────────────────
refresh_taskdef:
  stage: refresh
  image: amazon/aws-cli:latest
  needs: ["build"]
  before_script:
    - aws --version
  script:
    - aws ecs describe-task-definition --task-definition $CLUSTER_NAME --query 'taskDefinition' > base.json
    - apk add --no-cache jq
    - jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' base.json \
        > new-taskdef.json
    - NEW_ARN=$(aws ecs register-task-definition --cli-input-json file://new-taskdef.json \
        --query 'taskDefinition.taskDefinitionArn' --output text)
    - echo "New task-def ARN:" $NEW_ARN
    - aws ecs update-service --cluster $CLUSTER_NAME --service $SERVICE_NAME --task-definition $NEW_ARN
  rules:
    - when: always

# ──────────────────────────────────────────────────────────────────────────────
deploy:
  stage: deploy
  image: amazon/aws-cli:latest
  needs: ["refresh_taskdef"]
  script:
    - echo "Forcing new deployment on $CLUSTER_NAME/$SERVICE_NAME"
    - aws ecs update-service --cluster $CLUSTER_NAME --service $SERVICE_NAME --force-new-deployment
  rules:
    - when: manual