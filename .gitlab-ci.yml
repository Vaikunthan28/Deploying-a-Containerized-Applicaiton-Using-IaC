variables:
  AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"         # Stored in CI settings
  AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
  AWS_DEFAULT_REGION: "ap-southeast-2"
  AWS_ACCOUNT_ID: "${AWS_ACCOUNT_ID}"
  TF_ROOT: "terraform"
  TF_STATE_CONFIG: "${TF_ROOT}/tfstate.config"
  CLUSTER_NAME: "platform-cluster"
  SERVICE_NAME: "platform-service"
  TASK_NAME: "platform-task-df"

stages:
  - validate     # Check formatting and config
  - plan         # Generate Terraform plan
  - apply        # Apply Terraform changes
  - destroy      # Tear down resources
  - build        # Build & push Docker image
  - deploy

image:
   name: registry.gitlab.com/gitlab-org/gitlab-build-images:terraform
   entrypoint:
    - '/usr/bin/env'
    - 'PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'

cache:
  paths:
    - .terraform

before_script:
  - terraform --version
  - cd terraform
  - pwd
  - terraform init
  - cd ..

validate:
  stage: validate
  script:
    - cd $TF_ROOT
    - terraform validate

plan:
  stage: plan
  script:
    - cd $TF_ROOT
    - terraform plan -out=tfplan -input=false
  artifacts:
    paths:
      - $TF_ROOT/tfplan
  rules:
    - when: always

apply:
  stage: apply
  script:
    - cd $TF_ROOT
    - terraform apply -input=false tfplan
  when: manual      # Manual approval to avoid unintended changes
  rules:
    - when: manual

destroy:
  stage: destroy
  script:
    - cd $TF_ROOT
    - terraform destroy -auto-approve
  when: manual      # Manual to confirm destruction
  rules:
    - when: manual

build:
  stage: build
  image: docker:24.0.2  # Use Docker CLI image
  services:
    - name: docker:24.0.2-dind  # Use Docker-in-Docker as service
      alias: docker
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  before_script:
    # Install required tools
    - apk update && apk add --no-cache docker-cli
    - apk add --no-cache python3 aws-cli

    # Ensure Docker environment variables are properly set
    - export DOCKER_HOST="tcp://docker:2375"
    - docker --version
    - aws --version

    # Test Docker connectivity
    - echo "Testing Docker daemon connectivity..."
    - docker info || (echo "Docker daemon not available"; exit 1)

    # Validate Docker binary path
    - which docker
    - ls -l /usr/local/bin/docker

    # Fix environment issue with symbolic link
    - ln -s /usr/local/bin/docker /bin/docker

    # Login to AWS ECR
    - echo "Logging in to ECR..."
    - aws ecr get-login-password --region ap-southeast-2 | docker login --username AWS --password-stdin 826730732655.dkr.ecr.ap-southeast-2.amazonaws.com

  script:
    # Build and push Docker image
    - docker build -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/platform-starter:latest .
    - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/platform-starter:latest

  rules:
    - when: always
    
before_script:
  # Install curl and unzip
  - apk add --no-cache curl unzip

  # Download and extract AWS CLI v2
  - curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
  - unzip awscliv2.zip

  # Run the install script with sudo permissions
  - ./aws/install --bin-dir /usr/local/bin --install-dir /usr/local/aws-cli --update

  # Manually move the binary to a globally accessible location
  - ln -s /usr/local/aws-cli/v2/current/bin/aws /usr/local/bin/aws

  # Verify the installation
  - aws --version

deploy:
  stage: deploy
  image: amazon/aws-cli:latest
  script:
    - aws --version
    - echo "Deploying to ECS cluster:" $CLUSTER_NAME
    - aws ecs update-service \
        --cluster $CLUSTER_NAME \
        --service $SERVICE_NAME \
        --force-new-deployment
  rules:
    - when: always
